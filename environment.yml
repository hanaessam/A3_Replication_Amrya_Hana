name: aiddev-a3

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # --- Jupyter ---
  - jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets
  - nbformat

  # --- Core data ---
  - numpy>=1.26
  - pandas>=2.1
  - pyarrow>=14.0
  - scipy>=1.11

  # --- Machine learning ---
  - scikit-learn>=1.4

  # --- Visualization ---
  - matplotlib>=3.8
  - seaborn>=0.13

  # --- Utilities ---
  - tqdm>=4.66
  - openpyxl>=3.1
  - joblib>=1.3

  # --- pip packages ---
  - pip
  - pip:
      # HuggingFace dataset loading
      - datasets>=2.18
      - huggingface-hub>=0.21

      # PyTorch CPU wheels
      - torch
      - torchvision
      - torchaudio

      # Clustering helpers
      - yellowbrick>=1.5
      - umap-learn>=0.5

      # NLP / text representation
      - nltk>=3.8
      - transformers>=4.41
      - sentence-transformers>=3.0
      - accelerate>=0.30
